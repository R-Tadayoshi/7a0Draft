<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>⚽ Gridiron Cup — Online</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg:#0b0f14;--bg2:#11171f;--panel:#161d27;--panel2:#1c2530;--line:#26303c;--line2:#324050;
    --txt:#e7edf3;--muted:#8a98a8;--dim:#5e6b7a;--grn:#16c784;--grn2:#0f9d63;
    --pitch:#16382a;--pitch2:#1d4a37;--gold:#ffcb45;--red:#ff5d6c;--blue:#3da5ff;--pur:#9a7bff;
    --shadow:0 8px 30px rgba(0,0,0,.45);--radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:radial-gradient(1200px 600px at 50% -10%, #16202c 0%, var(--bg) 60%) fixed;color:var(--txt);
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;min-height:100vh}
  .wrap{max-width:1180px;margin:0 auto;padding:16px 14px 60px}
  h1,h2,h3,h4{margin:0}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit}
  input,select{font-family:inherit}
  .app-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px}
  .logo .accent{color:var(--grn)}
  .netpill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid var(--line2);background:var(--panel2)}
  .dot-ind{width:8px;height:8px;border-radius:50%}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pad{padding:18px}
  .muted{color:var(--muted)}.dim{color:var(--dim)}.center{text-align:center}
  .sectitle{font-size:12.5px;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);font-weight:800;margin-bottom:12px}
  .btn{background:linear-gradient(180deg,var(--grn),var(--grn2));color:#04130c;font-weight:800;padding:12px 20px;border-radius:12px;font-size:15px;box-shadow:0 6px 18px rgba(22,199,132,.25);transition:.12s}
  .btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none}
  .btn.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line2);box-shadow:none}
  .btn.sm{padding:8px 14px;font-size:13px}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;border:1px solid var(--line2);background:var(--panel2)}
  .row{display:flex;gap:14px;flex-wrap:wrap}.col{flex:1;min-width:0}
  input.txt{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:var(--txt);font-size:15px;width:100%}
  input.txt:focus{outline:none;border-color:var(--grn)}

  /* progress */
  .progress{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px;margin-bottom:18px}
  .progress .step{flex:1;text-align:center;font-size:12px;padding:8px 6px;border-radius:999px;color:var(--dim);font-weight:600;white-space:nowrap}
  .progress .step.done{color:var(--grn)}
  .progress .step.active{background:linear-gradient(180deg,var(--grn),var(--grn2));color:#04130c}

  /* lobby */
  .lobby-players{display:flex;flex-direction:column;gap:8px;margin:14px 0}
  .lp{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;background:var(--panel2);border:1px solid var(--line)}
  .lp.me{border-color:var(--grn)}
  .lp .av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--bg2);font-size:14px}
  .lp .lpn{flex:1;font-weight:700}
  .lp .badge{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:6px}

  /* draft */
  .pack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
  .pcard{display:flex;align-items:center;gap:9px;padding:9px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;transition:.12s}
  .pcard:hover{border-color:var(--grn);transform:translateY(-2px)}
  .pcard.dis{opacity:.5;pointer-events:none}
  .ovr{width:38px;height:38px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
  .ovr .v{font-size:16px;line-height:1}.ovr .p{font-size:8.5px;opacity:.85;margin-top:1px}
  .pinfo{min-width:0;flex:1}.pinfo .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pinfo .sub{font-size:11px;color:var(--muted);display:flex;gap:4px;align-items:center}
  .traits{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px}
  .trait{font-size:9px;padding:1px 5px;border-radius:5px;background:rgba(154,123,255,.14);color:var(--pur);font-weight:700}
  .draft-status{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-radius:14px;background:linear-gradient(100deg,var(--panel2),var(--panel));border:1px solid var(--line2);margin-bottom:14px;flex-wrap:wrap}
  .waitdots{display:flex;gap:5px}
  .wd{width:10px;height:10px;border-radius:50%;background:var(--line2)}
  .wd.done{background:var(--grn)}
  .myroster{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .rchip{font-size:11px;padding:3px 8px;border-radius:7px;background:var(--bg2);border:1px solid var(--line);font-weight:700}

  /* pitch / team setup */
  .pitch{position:relative;width:100%;aspect-ratio:68/100;max-height:560px;border-radius:16px;overflow:hidden;
    background:repeating-linear-gradient(0deg,var(--pitch) 0 9%,var(--pitch2) 9% 18%);border:2px solid #2a5a43}
  .mk{position:absolute;border:2px solid rgba(255,255,255,.13)}
  .slot{position:absolute;transform:translate(-50%,-50%);width:60px;text-align:center;cursor:pointer}
  .slot .disc{width:46px;height:46px;margin:0 auto;border-radius:50%;background:rgba(0,0,0,.35);border:2px dashed rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:rgba(255,255,255,.6)}
  .slot.filled .disc{border-style:solid;background:linear-gradient(180deg,#1d2733,#11171f)}
  .slot.sel .disc{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,203,69,.35)}
  .slot .nm{font-size:9.5px;margin-top:2px;font-weight:700;text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .slot .ovrtag{position:absolute;top:-5px;right:5px;background:var(--grn);color:#04130c;font-size:9.5px;font-weight:800;border-radius:6px;padding:0 4px}
  .slot.mismatch .ovrtag{background:var(--gold)}
  .formrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .formbtn{padding:7px 12px;border-radius:9px;background:var(--panel2);border:1px solid var(--line2);font-weight:800;font-size:12.5px;color:var(--muted)}
  .formbtn.on{background:var(--grn);color:#04130c}
  .tactrow{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .tactbtn{padding:10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line2);text-align:left}
  .tactbtn.on{border-color:var(--grn);background:rgba(22,199,132,.1)}
  .tactbtn .tt{font-weight:800;font-size:13px}.tactbtn .td{font-size:10px;color:var(--muted);margin-top:2px}
  .bench-pool{display:flex;flex-direction:column;gap:5px;max-height:260px;overflow-y:auto}
  .chembar{height:9px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:4px}
  .chembar>div{height:100%;background:linear-gradient(90deg,var(--red),var(--gold),var(--grn))}
  .synergy{display:flex;align-items:center;gap:7px;font-size:11.5px;padding:5px 8px;border-radius:8px;background:rgba(22,199,132,.08);border:1px solid rgba(22,199,132,.2);margin-top:5px}

  /* match 2D */
  .scoreboard{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line2);border-radius:14px;padding:12px 16px;gap:10px}
  .sb-team{flex:1;min-width:0}.sb-team.r{text-align:right}
  .sb-team .tn{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sb-team .tt{font-size:10.5px;color:var(--muted)}
  .sb-mid{text-align:center;min-width:96px}
  .sb-score{font-size:34px;font-weight:900;line-height:1}
  .sb-clock{font-size:12px;color:var(--gold);font-weight:800;margin-top:2px}
  @keyframes gf{0%{opacity:0;transform:scale(.5)}25%{opacity:1;transform:scale(1.1)}80%{opacity:1}100%{opacity:0}}
  /* live manager dashboard */
  .dash{margin-top:12px;background:var(--panel2);border:1px solid var(--line2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:9px}
  .dash-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .dash-lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);width:74px;flex-shrink:0}
  .seg5,.seg3,.segt{display:flex;gap:4px;flex:1;flex-wrap:wrap}
  .segb{flex:1;min-width:54px;padding:7px 6px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap;transition:.1s}
  .segb:hover{border-color:var(--line2);color:var(--txt)}
  .segb.on{background:var(--grn);border-color:var(--grn);color:#04130c}
  .subsel{background:var(--bg2);border:1px solid var(--line);border-radius:8px;color:var(--txt);font-size:11.5px;padding:6px}
  @media(max-width:560px){.dash-lbl{width:100%}.segb{min-width:46px}}
  .statbars{display:flex;flex-direction:column;gap:9px;margin-top:12px}
  .statbar .sl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:700}
  .track{height:7px;border-radius:99px;background:var(--bg2);overflow:hidden;display:flex}
  .fillH{background:var(--grn)}.fillA{background:var(--blue)}
  .feed{margin-top:12px;display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:10px;background:rgba(0,0,0,.12)}
  .ev{display:flex;gap:9px;padding:8px 11px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:13px;animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .ev .emin{font-weight:800;color:var(--gold);width:30px;flex-shrink:0}
  .ev.goal{border-color:var(--grn);background:rgba(22,199,132,.12)}.ev.goal .emin{color:var(--grn)}
  .livectl{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:12px;padding:12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2)}
  .livectl .tact-mini{display:flex;gap:5px;flex-wrap:wrap}
  .tmini{padding:6px 10px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--muted)}
  .tmini.on{background:var(--grn);color:#04130c}

  /* bracket */
  .bracket{display:flex;gap:22px;overflow-x:auto;padding:6px 2px 14px}
  .brd-round{display:flex;flex-direction:column;justify-content:space-around;gap:12px;min-width:190px}
  .brd-round h4{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);text-align:center;margin-bottom:4px}
  .match-card{border:1px solid var(--line);border-radius:10px;background:var(--panel2);overflow:hidden}
  .match-card.live{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .mside{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;font-size:13px;gap:8px}
  .mside+.mside{border-top:1px solid var(--line)}
  .mside.win{background:rgba(22,199,132,.1)}.mside.win .mn{color:var(--grn)}
  .mside .mn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .mside .ms{font-weight:800;width:20px;text-align:center}
  .bye{padding:8px;text-align:center;color:var(--dim);font-size:12px;font-style:italic}
  .playtag{display:block;text-align:center;font-size:11px;font-weight:800;color:var(--gold);padding:4px;background:rgba(255,203,69,.08)}

  /* champion */
  .champ{text-align:center;padding:28px 18px}
  .cup{font-size:74px;filter:drop-shadow(0 8px 20px rgba(255,203,69,.4));animation:float 2.5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .winner{font-size:32px;font-weight:900;margin:8px 0 4px;background:linear-gradient(90deg,var(--gold),#fff3c0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin:20px 0}
  .statbox{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:13px}
  .statbox .v{font-size:22px;font-weight:900;color:var(--grn)}.statbox .l{font-size:11px;color:var(--muted);text-transform:uppercase;margin-top:3px}

  .overlay{position:fixed;inset:0;background:rgba(4,7,11,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal{background:var(--panel);border:1px solid var(--line2);border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto}
  .modal .mhead{padding:15px 18px;border-bottom:1px solid var(--line);font-weight:800;font-size:16px}
  .modal .mbody{padding:16px 18px}.modal .mfoot{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}

  /* dev grid */
  .devbar{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid var(--line2);padding:6px 10px;font-size:11px;color:var(--gold);z-index:99;display:flex;gap:10px;align-items:center}
  .devgrid{display:grid;gap:8px;padding:8px}
  .devcell{border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--bg);position:relative}
  .devcell .dchead{position:sticky;top:0;background:#0a0d12;padding:4px 8px;font-size:11px;font-weight:800;border-bottom:1px solid var(--line2);z-index:2;display:flex;justify-content:space-between}
  .devcell .dcbody{height:520px;overflow-y:auto;padding:8px;zoom:.78}
  @media(max-width:760px){.scoreboard .sb-team .tt{display:none}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useMemo,useCallback}=React;

/* ===================== DATA ===================== */
const FLAGS={Brazil:"🇧🇷",Germany:"🇩🇪",France:"🇫🇷",Argentina:"🇦🇷",Spain:"🇪🇸",England:"🏴󠁧󠁢󠁥󠁮󠁧󠁿"};
const RAW={
 Brazil:[["Rafael Costa","GK",82],["Bruno Tavares","GK",75],["Thiago Ramos","DEF",88],["Marcelo Dias","DEF",85],["Lucas Pereira","DEF",83],["Diego Souza","DEF",80],["Felipe Moraes","DEF",78],["Caio Nunes","DEF",74],["Vinícius Lima","MID",90],["Gabriel Rocha","MID",87],["Rodrigo Alves","MID",84],["Matheus Cardoso","MID",82],["Paulo Henrique","MID",80],["Igor Fernandes","MID",77],["Léo Barbosa","MID",73],["Ronaldo Júnior","ATT",92],["Neymar Castro","ATT",91],["Richarlison Gomes","ATT",85],["Anderson Vieira","ATT",81],["Wesley Pinto","ATT",78]],
 Germany:[["Manuel Berg","GK",86],["Kevin Falk","GK",77],["Niklas Wolf","DEF",87],["Jonas Krüger","DEF",85],["Antonio Richter","DEF",83],["Lukas Brandt","DEF",80],["Maximilian Eich","DEF",77],["David Stein","DEF",73],["Tobias Krause","MID",89],["Joshua Kämpf","MID",86],["Leon Hofmann","MID",84],["Florian Weber","MID",82],["Julian Bauer","MID",79],["Marco Lang","MID",76],["Pascal Vogt","MID",72],["Thomas Müller","ATT",88],["Kai Werner","ATT",86],["Timo Schäfer","ATT",84],["Serge Albrecht","ATT",82],["Leroy Sommer","ATT",79]],
 France:[["Hugo Marchand","GK",85],["Alphonse Girard","GK",76],["Raphaël Dubois","DEF",88],["Lucien Moreau","DEF",86],["Presnel Garnier","DEF",84],["Théo Lefèvre","DEF",81],["Benjamin Roche","DEF",78],["Clément Faure","DEF",74],["Paul Mercier","MID",90],["Nabil Cissé","MID",87],["Adrien Laurent","MID",85],["Eduardo Camara","MID",83],["Mattéo Blanc","MID",80],["Youssouf Diallo","MID",77],["Hugo Petit","MID",73],["Kylian Lefebvre","ATT",93],["Antoine Rousseau","ATT",88],["Ousmane Koné","ATT",85],["Florian Henry","ATT",82],["Marcus Thiam","ATT",79]],
 Argentina:[["Emiliano Romero","GK",84],["Franco Aguirre","GK",76],["Cristian Vega","DEF",86],["Nicolás Acosta","DEF",84],["Germán Suárez","DEF",82],["Lisandro Molina","DEF",79],["Nahuel Ortiz","DEF",77],["Facundo Herrera","DEF",73],["Lionel Giménez","MID",94],["Rodrigo Paredes","MID",88],["Alexis Ríos","MID",85],["Exequiel Castro","MID",83],["Thiago Benítez","MID",80],["Joaquín Medina","MID",77],["Tomás Ferreyra","MID",73],["Lautaro Cabrera","ATT",89],["Ángel Domínguez","ATT",86],["Julián Sosa","ATT",84],["Gonzalo Rivas","ATT",82],["Nicolás Funes","ATT",79]],
 Spain:[["Unai Castillo","GK",84],["Sergio Marín","GK",76],["Pau Serra","DEF",86],["Aymeric Lozano","DEF",85],["Dani Vázquez","DEF",83],["Jordi Campos","DEF",80],["Marcos Ibáñez","DEF",78],["Hugo Reyes","DEF",74],["Pedro Salas","MID",91],["Iker Bravo","MID",87],["Sergio Cano","MID",85],["Mikel Ortega","MID",83],["Carlos Prieto","MID",80],["Álvaro Gil","MID",77],["Rubén Soto","MID",73],["Ferran Lorente","ATT",86],["Marco Esteban","ATT",85],["Nico Aguilar","ATT",84],["Pablo Romero","ATT",81],["Diego Morales","ATT",78]],
 England:[["Jordan Hughes","GK",85],["Aaron Webb","GK",77],["Harry Stones","DEF",87],["Kyle Walsh","DEF",84],["John Bridges","DEF",83],["Reece Hart","DEF",81],["Ben Chambers","DEF",78],["Luke Whitfield","DEF",74],["Jude Bellamy","MID",92],["Phil Sterling","MID",88],["Declan Rhys","MID",87],["Mason Crowe","MID",84],["Conor Hayes","MID",80],["Eli Marsh","MID",77],["Cole Ashby","MID",73],["Harry Cane","ATT",90],["Bukayo Reed","ATT",86],["Marcus Field","ATT",84],["Jack Dawson","ATT",81],["Ollie Grant","ATT",78]],
};
const TRAIT_POOL={GK:["Cat","Wall","Sweeper-Keeper","Commanding"],DEF:["Rock","Aerial Threat","Ball-Winner","Sweeper","Tank","Set-Piece Specialist"],MID:["Engine","Playmaker","Maestro","Box-to-Box","Creator","Ball-Winner"],ATT:["Sniper","Poacher","Speedster","Dribbler","Target Man","Clinical","Magician"]};
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function deriveAttrs(name,pos,ovr){const h=hashStr(name);const j=(k,s)=>Math.round((((h>>(k*3))&7)/7-0.5)*2*s);
  const T={GK:{pace:-26,shooting:-42,passing:-14,defending:-2,physical:-8},DEF:{pace:-6,shooting:-19,passing:-9,defending:3,physical:2},MID:{pace:-4,shooting:-6,passing:3,defending:-6,physical:-3},ATT:{pace:2,shooting:3,passing:-5,defending:-22,physical:-4}}[pos];
  return {pace:clamp(ovr+T.pace+j(0,4),32,99),shooting:clamp(ovr+T.shooting+j(1,4),28,99),passing:clamp(ovr+T.passing+j(2,4),35,99),defending:clamp(ovr+T.defending+j(3,4),28,99),physical:clamp(ovr+T.physical+j(4,4),40,99)};}
function deriveTraits(name,pos,ovr){const pool=TRAIT_POOL[pos];const h=hashStr(name+"t");const t1=pool[h%pool.length];const out=[t1];
  if(ovr>=85){const t2=pool[(h>>4)%pool.length];out.push(t2!==t1?t2:pool[((h>>4)+1)%pool.length]);}return out;}
const ALL_PLAYERS=[];
Object.entries(RAW).forEach(([team,arr])=>arr.forEach(([name,pos,ovr])=>{
  ALL_PLAYERS.push({id:team.slice(0,3).toUpperCase()+"-"+hashStr(name).toString(36).slice(0,5),name,team,pos,ovr,flag:FLAGS[team],...deriveAttrs(name,pos,ovr),traits:deriveTraits(name,pos,ovr)});
}));
const PBI=Object.fromEntries(ALL_PLAYERS.map(p=>[p.id,p]));

function slotsFor(f){return FORMATIONS[f].map((s,i)=>({key:"s"+i,label:s[0],cat:s[1],x:s[2],y:s[3]}));}

/* ===================== CHEMISTRY ===================== */
// Player chem 0..10 based on position fit + same-nation teammates. Team chem avg drives a rating multiplier.
function computeChem(lineup,formation){
  const slots=slotsFor(formation);
  const placed=slots.map(s=>({s,p:lineup[s.key]?PBI[lineup[s.key]]:null})).filter(x=>x.p);
  const nationCount={};placed.forEach(x=>nationCount[x.p.team]=(nationCount[x.p.team]||0)+1);
  const per={};
  placed.forEach(({s,p})=>{
    let c=5;
    if(s.cat===p.pos)c+=3;else{const d=Math.abs(POS_ORDER[s.cat]-POS_ORDER[p.pos]);c-=(s.cat==="GK"||p.pos==="GK")?5:d===1?1:2.5;}
    const same=nationCount[p.team]-1;c+=clamp(same*1.1,0,4);
    per[p.id]=clamp(c,0,10);
  });
  const vals=Object.values(per);const team=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:5;
  // trait synergies (team-level)
  const traits={};placed.forEach(({p})=>p.traits.forEach(t=>traits[t]=(traits[t]||0)+1));
  const syn=[];
  const has=(t,n=1)=>(traits[t]||0)>=n;
  if((has("Playmaker")||has("Creator")||has("Maestro"))&&(has("Poacher")||has("Clinical")||has("Sniper")))syn.push({k:"Final Ball",d:"Playmaker → finisher link",att:0.05});
  if(has("Set-Piece Specialist")&&has("Aerial Threat"))syn.push({k:"Set-Piece Threat",d:"Dead-ball + aerial",setp:0.5});
  if((traits["Engine"]||0)+(traits["Box-to-Box"]||0)>=2)syn.push({k:"Relentless Engine",d:"Midfield runners",poss:4});
  if((traits["Ball-Winner"]||0)+(traits["Rock"]||0)+(traits["Tank"]||0)>=2)syn.push({k:"Brick Wall",d:"Defensive grit",def:0.05});
  if((traits["Speedster"]||0)+(traits["Dribbler"]||0)>=2)syn.push({k:"Pace to Burn",d:"Direct runners",att:0.04});
  // dominant nation bonus
  const topNation=Object.entries(nationCount).sort((a,b)=>b[1]-a[1])[0];
  if(topNation&&topNation[1]>=6)syn.push({k:"National Core",d:topNation[1]+" "+topNation[0]+" players",chem:1});
  return {per,team:clamp(team+(syn.find(s=>s.chem)?syn.find(s=>s.chem).chem:0),0,10),syn,nationCount};
}
function chemMult(teamChem){return 0.92+(teamChem/10)*0.14;} // 0.92 .. 1.06

/* ===================== ENGINE ===================== */
function posMult(sc,pp){if(sc===pp)return 1;const d=Math.abs(POS_ORDER[sc]-POS_ORDER[pp]);if(sc==="GK"||pp==="GK")return .55;return d===1?.86:.72;}
function lineRatings(mgr){
  const slots=slotsFor(mgr.formation);const eff={GK:[],DEF:[],MID:[],ATT:[]};
  slots.forEach(s=>{const pid=mgr.lineup[s.key];if(pid){const p=PBI[pid];eff[s.cat].push({p,v:p.ovr*posMult(s.cat,p.pos)});}});
  const avg=a=>a.length?a.reduce((x,y)=>x+y.v,0)/a.length:62;
  const chem=computeChem(mgr.lineup,mgr.formation);const cm=chemMult(chem.team);
  const gk=(eff.GK[0]?eff.GK[0].v:60);const def=avg(eff.DEF),mid=avg(eff.MID),att=avg(eff.ATT);
  const synAtt=1+chem.syn.reduce((a,s)=>a+(s.att||0),0);const synDef=1+chem.syn.reduce((a,s)=>a+(s.def||0),0);
  return {gk:gk*cm,def:def*cm,mid:mid*cm,att:att*cm,
    teamAtt:(0.6*att+0.4*mid)*cm*synAtt,teamDef:(0.5*def+0.28*gk+0.22*mid)*cm*synDef,teamMid:mid*cm,
    chem,attackers:eff.ATT.map(e=>e.p),mids:eff.MID.map(e=>e.p),defs:eff.DEF.map(e=>e.p),keeper:eff.GK[0]?eff.GK[0].p:null};
}
function squadStrength(mgr){const L=lineRatings(mgr);return Math.round((L.teamAtt+L.teamDef+L.teamMid)/3);}
function tacticAttMult(my,opp){let m=TACTIC_MOD[my].att;if(BEATS[my]===opp)m*=1.12;if(BEATS[opp]===my)m*=0.90;return m;}
function weightedPick(ps,attr){if(!ps.length)return null;const w=ps.map(p=>Math.pow(p[attr]||p.ovr,2));let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<ps.length;i++){r-=w[i];if(r<=0)return ps[i];}return ps[ps.length-1];}

};const a=m[t]||["drives forward","gets a shot away","makes something happen","tries his luck"];return a[Math.floor(Math.random()*a.length)];}

/* ===================== HOST GAME LOGIC (authoritative) =====================
   The host owns `G` (game state). Mutations -> broadcastState(). Clients send actions.
*/
function newGame(){return {phase:"lobby",players:[],draft:null,tourney:null,match:null,maxPlayers:8,minPlayers:2};}
function addPlayer(G,id,name){
  if(G.phase!=="lobby")return {ok:false,reason:"started"};
  if(G.players.length>=G.maxPlayers)return {ok:false,reason:"full"};
  if(G.players.find(p=>p.id===id))return {ok:true};
  G.players.push({id,name:name||("Manager "+(G.players.length+1)),connected:true,roster:[],formation:"4-3-3",tactic:"Possession",lineup:{},ready:false});
  return {ok:true};
}
function buildPacks(n){
  // n packs of ROSTER_SIZE, position-balanced. Deal round-robin by position bucket.
  const buckets={GK:[],DEF:[],MID:[],ATT:[]};
  ALL_PLAYERS.forEach(p=>buckets[p.pos].push(p));
  Object.values(buckets).forEach(b=>b.sort(()=>Math.random()-0.5));
  const packs=Array.from({length:n},()=>[]);
  // target composition per pack ~ 1 GK,4 DEF,5 MID,4 ATT (14)
  const plan=[["GK",1],["DEF",4],["MID",5],["ATT",4]];
  plan.forEach(([pos,cnt])=>{for(let c=0;c<cnt;c++)for(let i=0;i<n;i++){const card=buckets[pos].pop();if(card)packs[i].push(card.id);}});
  // top up any short packs from leftovers
  const left=[].concat(...Object.values(buckets)).map(p=>p.id);
  packs.forEach(pk=>{while(pk.length<ROSTER_SIZE&&left.length)pk.push(left.pop());});
  packs.forEach(pk=>pk.sort(()=>Math.random()-0.5));
  return packs;
}
function startDraft(G){
  const n=G.players.length;const packs=buildPacks(n);
  G.phase="draft";
  G.draft={round:1,pickNo:1,direction:1,
    // packIndex[i] = which pack player i currently holds
    packs, holding:G.players.map((_,i)=>i), picks:{}, // picks[playerId]=true once picked this round
    autoAt:Date.now()+22000};
  G.players.forEach(p=>p.roster=[]);
}
function draftPick(G,playerId,cardId){
  const d=G.draft;if(!d||G.phase!=="draft")return;
  const pi=G.players.findIndex(p=>p.id===playerId);if(pi<0)return;
  if(d.picks[playerId])return; // already picked this round
  const packIdx=d.holding[pi];const pack=d.packs[packIdx];
  if(!pack||!pack.includes(cardId))return;
  // remove card, add to roster
  d.packs[packIdx]=pack.filter(c=>c!==cardId);
  G.players[pi].roster.push(cardId);
  d.picks[playerId]=true;
  // if all players have picked this round -> pass packs and advance
  if(G.players.every(p=>d.picks[p.id]))advanceDraftRound(G);
}
function autoPickFor(G,playerId){
  const d=G.draft;const pi=G.players.findIndex(p=>p.id===playerId);if(pi<0||d.picks[playerId])return;
  const pack=d.packs[d.holding[pi]]||[];if(!pack.length){d.picks[playerId]=true;if(G.players.every(p=>d.picks[p.id]))advanceDraftRound(G);return;}
  // pick best by need: ensure a GK, then best overall
  const r=G.players[pi].roster.map(id=>PBI[id]);const hasGK=r.some(p=>p.pos==="GK");
  let cand=pack.map(id=>PBI[id]);
  if(!hasGK&&G.players[pi].roster.length>=ROSTER_SIZE-2){const gk=cand.filter(p=>p.pos==="GK").sort((a,b)=>b.ovr-a.ovr)[0];if(gk){draftPick(G,playerId,gk.id);return;}}
  cand.sort((a,b)=>b.ovr-a.ovr);draftPick(G,playerId,cand[0].id);
}
function advanceDraftRound(G){
  const d=G.draft;const n=G.players.length;
  if(d.round>=ROSTER_SIZE){ // draft complete
    G.players.forEach(p=>{p.lineup=autoFill(p.roster,p.formation);});
    G.phase="setup";return;
  }
  // pass packs one seat (rotate holdings); direction alternates each round for a snake-wheel feel.
  // newHolding[i] = oldHolding[(i+offset)%n] — a cyclic shift, so packs stay 1:1 with players.
  const prev=d.holding.slice();const offset=d.round%2===1?1:n-1;
  d.holding=prev.map((_,i)=>prev[(i+offset)%n]);
  d.round++;d.pickNo=1;d.picks={};d.autoAt=Date.now()+22000;
}
function autoFill(roster,form){
  const slots=slotsFor(form);const pool=[...roster].map(id=>PBI[id]).sort((a,b)=>b.ovr-a.ovr);
  const used=new Set();const lineup={};
  for(const cat of ["GK","DEF","MID","ATT"]){for(const s of slots.filter(x=>x.cat===cat)){const pk=pool.find(p=>!used.has(p.id)&&p.pos===cat);if(pk){lineup[s.key]=pk.id;used.add(pk.id);}}}
  for(const s of slots){if(!lineup[s.key]){const pk=pool.find(p=>!used.has(p.id));if(pk){lineup[s.key]=pk.id;used.add(pk.id);}}}
  return lineup;
}
function setLineup(G,playerId,lineup,formation,tactic){const p=G.players.find(x=>x.id===playerId);if(!p)return;if(lineup)p.lineup=lineup;if(formation)p.formation=formation;if(tactic)p.tactic=tactic;}
function setReady(G,playerId,v){const p=G.players.find(x=>x.id===playerId);if(p)p.ready=v;if(G.phase==="setup"&&G.players.every(x=>x.ready&&Object.keys(x.lineup).length===STARTERS))startTournament(G);}

/* ---- tournament ---- */
function nextPow2(n){let p=1;while(p<n)p*=2;return p;}
function seedOrder(size){let a=[1,2];while(a.length<size){const m=a.length*2+1;const nx=[];a.forEach(s=>{nx.push(s);nx.push(m-s);});a=nx;}return a;}
function startTournament(G){
  const seeded=[...G.players].map(p=>({id:p.id,name:p.name,str:squadStrength(p)})).sort((a,b)=>b.str-a.str);
  seeded.forEach((s,i)=>s.seed=i+1);
  G.tourney={seeded,type:G.players.length<5?"rr":"se"};
  if(G.tourney.type==="rr"){
    const sch=[];for(let i=0;i<seeded.length;i++)for(let j=i+1;j<seeded.length;j++)sch.push({a:seeded[i].id,b:seeded[j].id,played:false,sh:null,sa:null});
    G.tourney.schedule=sch;
  }else{
    const size=nextPow2(seeded.length);const order=seedOrder(size);
    const ids=order.map(s=>s<=seeded.length?seeded[s-1].id:null);
    let ms=[];for(let i=0;i<ids.length;i+=2)ms.push(mkMatch(ids[i],ids[i+1]));
    G.tourney.rounds=[ms];
  }
  G.phase="tournament";
}
function mkMatch(a,b){let m={a,b,winner:null,sh:null,sa:null,played:false};if(a&&!b){m.winner=a;m.played=true;m.bye=true;}if(!a&&b){m.winner=b;m.played=true;m.bye=true;}return m;}
function nextTournamentMatch(G){
  const t=G.tourney;
  if(t.type==="rr"){const m=t.schedule.find(x=>!x.played);return m?{kind:"rr",match:m}:null;}
  for(let r=0;r<t.rounds.length;r++)for(let i=0;i<t.rounds[r].length;i++){const m=t.rounds[r][i];if(!m.played&&m.a&&m.b)return {kind:"se",match:m,round:r,idx:i};}
  return null;
}
function recordResult(G,sh,sa,winnerId){
  const t=G.tourney;const cur=G.match;
  if(t.type==="rr"){const m=t.schedule.find(x=>x.a===cur.aId&&x.b===cur.bId&&!x.played);if(m){m.played=true;m.sh=sh;m.sa=sa;}}
  else{const found=nextTournamentMatch(G);if(found){const m=found.match;m.sh=sh;m.sa=sa;m.played=true;m.winner=sh>sa?m.a:sa>sh?m.b:winnerId;}
    // build next round if complete
    let rds=t.rounds;while(rds[rds.length-1].length>1&&rds[rds.length-1].every(m=>m.played)){const w=rds[rds.length-1].map(m=>m.winner);let nm=[];for(let i=0;i<w.length;i+=2)nm.push(mkMatch(w[i],w[i+1]));rds.push(nm);}}
  G.match=null;
  // champion?
  const champ=getChampion(G);
  if(champ){G.phase="champion";G.championId=champ;}
}
function getChampion(G){const t=G.tourney;
  if(t.type==="rr"){if(t.schedule.every(m=>m.played)){const tbl=standings(G);return tbl[0].id;}return null;}
  const last=t.rounds[t.rounds.length-1];return last.length===1&&last[0].played?last[0].winner:null;}
function standings(G){const t={};G.tourney.seeded.forEach(s=>t[s.id]={id:s.id,P:0,W:0,D:0,L:0,GF:0,GA:0,Pts:0});
  G.tourney.schedule.forEach(m=>{if(!m.played)return;const A=t[m.a],B=t[m.b];A.P++;B.P++;A.GF+=m.sh;A.GA+=m.sa;B.GF+=m.sa;B.GA+=m.sh;if(m.sh>m.sa){A.W++;B.L++;A.Pts+=3;}else if(m.sh<m.sa){B.W++;A.L++;B.Pts+=3;}else{A.D++;B.D++;A.Pts++;B.Pts++;}});
  return Object.values(t).sort((a,b)=>b.Pts-a.Pts||(b.GF-b.GA)-(a.GF-a.GA)||b.GF-a.GF);}

/* ---- LIVE MATCH (host-simulated, text commentary) ----
   The match streams as a commentary feed (~2 min real time). Managers freely
   adjust two live dials any time during play — Mentality and Intensity — plus
   their tactic and substitutions. No pauses, no pitch graphics. */
// drain = stamina burned per game-minute. Attacking & high-press cost cardio.
const MENTALITY=[
  {label:"Very Def.",att:0.78,def:1.22,drain:0.04},
  {label:"Defensive",att:0.90,def:1.10,drain:0.08},
  {label:"Balanced", att:1.00,def:1.00,drain:0.13},
  {label:"Attacking",att:1.12,def:0.90,drain:0.24},
  {label:"All-Out",  att:1.26,def:0.76,drain:0.38},
];
const INTENSITY=[
  {label:"Low",  freq:0.82,att:0.97,def:1.05,drain:0.06}, // sit back, control, conserve legs
  {label:"Medium",freq:1.00,att:1.00,def:1.00,drain:0.18},
  {label:"High", freq:1.18,att:1.05,def:0.95,drain:0.34}, // press hard, open game, burns legs
];
// tired legs sap effectiveness: 100→×1.0, 50→×0.91, 0→×0.82 (applied to att & def)
function stamFactor(s){return 0.82+0.18*(clamp(s,0,100)/100);}
function startMatch(G,aId,bId,knockout){
  const A=G.players.find(p=>p.id===aId),B=G.players.find(p=>p.id===bId);
  G.match={aId,bId,knockout,minute:0,beat:0,score:{h:0,a:0},
    stats:{shH:0,shA:0,sotH:0,sotA:0,ph:0,pa:0,xgH:0,xgA:0},
    possSide:"h",events:[],htDone:false,
    aTactic:A.tactic,bTactic:B.tactic,aLineup:{...A.lineup},bLineup:{...B.lineup},aForm:A.formation,bForm:B.formation,
    aSubs:0,bSubs:0,aMent:2,bMent:2,aInt:1,bInt:1,aStam:100,bStam:100,aTired:0,bTired:0,
    running:true,finished:false};
}
function matchTactic(G,side,tactic){if(!G.match)return;if(side==="h")G.match.aTactic=tactic;else G.match.bTactic=tactic;}
function matchSet(G,key,field,value){const m=G.match;if(!m)return; // key:"a"|"b", field:"Ment"|"Int"
  if(field==="Ment")m[key+"Ment"]=clamp(value,0,MENTALITY.length-1);
  else if(field==="Int")m[key+"Int"]=clamp(value,0,INTENSITY.length-1);}
function matchSub(G,side,outPid,inPid){const m=G.match;if(!m)return;const lu=side==="h"?m.aLineup:m.bLineup;const cnt=side==="h"?"aSubs":"bSubs";if(m[cnt]>=3)return;
  const k=Object.keys(lu).find(kk=>lu[kk]===outPid);if(!k)return;lu[k]=inPid;m[cnt]++;
  // fresh legs lift the whole side's stamina
  const sk=side==="h"?"aStam":"bStam";m[sk]=clamp(m[sk]+12,0,100);
  const nm=G.players.find(p=>p.id===(side==="h"?m.aId:m.bId)).name;
  m.events.unshift(mkEv(m.minute,"info",`🔄 ${nm}: ${PBI[inPid].name} on for ${PBI[outPid].name} — fresh legs.`,side==="h"));}
// one beat ≈ 700ms. Clock +1' every 2 beats. Live settings apply continuously.
function matchBeat(G){
  const m=G.match;if(!m||m.finished)return;
  m.beat++;
  const A=G.players.find(p=>p.id===m.aId),B=G.players.find(p=>p.id===m.bId);
  const ha={...A,lineup:m.aLineup,formation:m.aForm,tactic:m.aTactic};
  const aw={...B,lineup:m.bLineup,formation:m.bForm,tactic:m.bTactic};
  const LH=lineRatings(ha),LA=lineRatings(aw);
  const aM=MENTALITY[m.aMent],bM=MENTALITY[m.bMent],aI=INTENSITY[m.aInt],bI=INTENSITY[m.bInt];
  const sfH=stamFactor(m.aStam),sfA=stamFactor(m.bStam);   // tired legs = weaker everywhere
  const attH=LH.teamAtt*tacticAttMult(m.aTactic,m.bTactic)*aM.att*aI.att*sfH;
  const attA=LA.teamAtt*tacticAttMult(m.bTactic,m.aTactic)*bM.att*bI.att*sfA;
  const defH=LH.teamDef*TACTIC_MOD[m.aTactic].def*aM.def*aI.def*sfH;
  const defA=LA.teamDef*TACTIC_MOD[m.bTactic].def*bM.def*bI.def*sfA;
  let pBase=50+(LH.teamMid-LA.teamMid)*0.7+(TACTIC_MOD[m.aTactic].poss-TACTIC_MOD[m.bTactic].poss);pBase=clamp(pBase,28,72);
  const homeBall=Math.random()*100<pBase;m.possSide=homeBall?"h":"a";
  if(homeBall)m.stats.ph++;else m.stats.pa++;
  // clock & chances on every 2nd beat
  if(m.beat%2===0){
    m.minute=Math.min(90,m.minute+1);
    // CARDIO: drain stamina each minute by chosen mentality + intensity
    m.aStam=clamp(m.aStam-(aM.drain+aI.drain),0,100);
    m.bStam=clamp(m.bStam-(bM.drain+bI.drain),0,100);
    // tiredness commentary as a side flags (once per threshold crossing)
    [["a",m.aStam,A.name],["b",m.bStam,B.name]].forEach(([k,s,nm])=>{
      const tk=k+"Tired";const lvl=s<25?2:s<42?1:0;
      if(lvl>m[tk]){m[tk]=lvl;m.events.unshift(mkEv(m.minute,"info","💨 "+say("tired",{team:nm}),k==="a"));}
    });
    if(m.minute===45&&!m.htDone){m.htDone=true;m.events.unshift(mkEv(45,"info",`⏸ Half-time: ${A.name} ${m.score.h}–${m.score.a} ${B.name}.`,true));}
    if(m.minute>=90){m.finished=true;m.running=false;finishMatch(G);return;}
    const tempo=(aI.freq+bI.freq)/2;
    // occasional non-chance flavour to add texture
    if(Math.random()<0.07){const sideH=Math.random()<0.5;const nm=(sideH?A:B).name;
      const fl=(sideH?LH:LA);const pl=(fl.mids.concat(fl.defs,fl.attackers))[0]||{name:"a player"};
      m.events.unshift(mkEv(m.minute,"misc",say("misc",{team:nm,p:pl.name}),sideH));if(m.events.length>40)m.events.pop();}
    if(Math.random()<0.34*tempo){
      const hAtk=Math.random()*100<pBase*0.55+(attH/(attH+attA))*45;
      const r=(hAtk?attH:attA)/((hAtk?attH:attA)+(hAtk?defA:defH));
      const Lk=hAtk?LH:LA;const atkM=hAtk?ha:aw;const keeper=(hAtk?LA:LH).keeper;
      const shooters=(Lk.attackers.length?Lk.attackers:Lk.mids).concat(Math.random()<0.3?Lk.mids:[]);
      const player=weightedPick(shooters,"shooting")||{name:"the striker",traits:["Sniper"]};
      const mate=(Lk.mids.concat(Lk.attackers).filter(x=>x!==player)[Math.floor(Math.random()*Math.max(1,Lk.mids.length))])||player;
      const ctx={p:player.name,flavor:traitFlavor(player),team:atkM.name,keeper:keeper?keeper.name:"the keeper",mate:mate.name};
      const xg=clamp(r,0.05,0.85)*0.34;
      const roll=Math.random();
      if(roll<0.22){m.events.unshift(mkEv(m.minute,"build",say("build",ctx),hAtk));}
      else{
        if(hAtk){m.stats.shH++;m.stats.xgH+=xg;}else{m.stats.shA++;m.stats.xgA+=xg;}
        const sot=Math.random()<clamp(0.50+(r-0.5)*0.8,0.25,0.85);
        if(!sot){m.events.unshift(mkEv(m.minute,"shot",say("wide",ctx),hAtk,true));}
        else{
          if(hAtk)m.stats.sotH++;else m.stats.sotA++;
          const gk=keeper?keeper.ovr:62;const setp=Lk.chem.syn.find(s=>s.setp)?1.06:1;
          const goalP=clamp((r*0.95)+0.12-(gk-72)*0.005,0.10,0.82)*setp*(TACTIC_MOD[atkM.tactic].att>1?1.05:1);
          if(Math.random()<goalP){
            if(hAtk)m.score.h++;else m.score.a++;
            m.events.unshift(mkEv(m.minute,"goal","⚽ "+say("goal",ctx)+` (${m.score.h}–${m.score.a})`,hAtk,true));
          }else{m.events.unshift(mkEv(m.minute,"save",say("save",ctx),hAtk,true));}
        }
      }
      if(m.events.length>40)m.events.pop();
    }
  }
}
function mkEv(min,type,text,homeSide,big){return {min,type,text,homeSide:!!homeSide,big:!!big,t:Date.now()+Math.random()};}
function finishMatch(G){
  const m=G.match;let sh=m.score.h,sa=m.score.a,winnerId=null;
  if(m.knockout&&sh===sa){const so=penaltyShootout(G,m.aId,m.bId);m.shootout=so;winnerId=so.winnerId;
    m.events.unshift(mkEv(90,"goal",`🥅 Penalties: ${G.players.find(p=>p.id===winnerId).name} win ${so.h}–${so.a}!`,winnerId===m.aId,true));}
  m.resultReady={sh,sa,winnerId};
}
function penaltyShootout(G,aId,bId){const A=G.players.find(p=>p.id===aId),B=G.players.find(p=>p.id===bId);
  const sa=squadStrength(A),sb=squadStrength(B);const pA=clamp(0.62+(sa-72)*0.006,0.55,0.9),pB=clamp(0.62+(sb-72)*0.006,0.55,0.9);
  let h=0,a=0;for(let i=0;i<5;i++){if(Math.random()<pA)h++;if(Math.random()<pB)a++;}
  while(h===a){if(Math.random()<pA)h++;if(Math.random()<pB)a++;}return {winnerId:h>a?aId:bId,h,a};}

/* ===================== STATE VIEW (per player) =====================
   Strip secret info (other players' current packs) before sending to a client.
*/
function publicState(G,forId){
  const s=JSON.parse(JSON.stringify(G));
  if(s.draft){
    const pi=s.players.findIndex(p=>p.id===forId);
    s.draft.yourPack=pi>=0?(G.draft.packs[G.draft.holding[pi]]||[]):[];
    s.draft.youPicked=pi>=0?!!G.draft.picks[forId]:false;
    s.draft.pickedCount=Object.keys(G.draft.picks).length;
    delete s.draft.packs; // hide
  }
  s.you=forId;
  return s;
}

/* ===================== NETWORK LAYER ===================== */
const APP_ID="gridiron-cup-v2-9f";  // bump to reset rooms
const MAX_ROOMS=12;
// ICE config: Google STUP for same-network/easy-NAT, free OpenRelay TURN to relay through
// strict NATs (mobile/corporate). TURN is what makes cross-network play reliable.
const ICE={iceServers:[
  {urls:"stun:stun.l.google.com:19302"},
  {urls:"stun:stun1.l.google.com:19302"},
  {urls:"turn:openrelay.metered.ca:80",username:"openrelayproject",credential:"openrelayproject"},
  {urls:"turn:openrelay.metered.ca:443",username:"openrelayproject",credential:"openrelayproject"},
  {urls:"turn:openrelay.metered.ca:443?transport=tcp",username:"openrelayproject",credential:"openrelayproject"},
]};
const PEER_OPTS={debug:1,config:ICE};
// Loopback hub for ?dev mode
class Hub{constructor(){this.peers={};}reg(id,cb){this.peers[id]={cb};}unreg(id){delete this.peers[id];}
  send(from,to,msg){const p=this.peers[to];if(p)setTimeout(()=>p.cb(from,JSON.parse(JSON.stringify(msg))),4+Math.random()*6);}}

/* A Node represents one player's networking+game controller.
   - Host node: owns authoritative G, applies actions, broadcasts publicState to each client.
   - Client node: forwards actions to host, receives state.
   onState(state) called whenever this node's view updates.
*/
class Node{
  constructor({name,onState,onStatus,transport}){
    this.name=name;this.onState=onState||(()=>{});this.onStatus=onStatus||(()=>{});
    this.transport=transport; // {selfId, send(to,msg), onMessage(cb), connectHost(hostId,cb), claimHost(id), close()}
    this.isHost=false;this.hostId=null;this.selfId=null;this.G=null;this.conns={};this.state=null;
    this.matchTimer=null;this.draftTimer=null;
  }
  /* HOST */
  becomeHost(){
    this.isHost=true;this.hostId=this.selfId;this.G=newGame();
    addPlayer(this.G,this.selfId,this.name);
    this.onStatus({role:"host",room:this.roomNo,id:this.selfId});
    this.broadcast();
    this.startLoops();
  }
  startLoops(){
    if(this.draftTimer)clearInterval(this.draftTimer);
    this.draftTimer=setInterval(()=>this.hostTick(),700);
  }
  hostTick(){
    const G=this.G;if(!G)return;let dirty=false;
    if(G.phase==="draft"&&G.draft){
      if(Date.now()>=G.draft.autoAt){G.players.forEach(p=>{if(!G.draft.picks[p.id])autoPickFor(G,p.id);});dirty=true;}
    }
    if(G.phase==="tournament"&&G.match&&G.match.running){
      matchBeat(G);dirty=true;
    }
    if(dirty)this.broadcast();
  }
  hostHandleAction(fromId,a){
    const G=this.G;if(!G)return;
    switch(a.t){
      case "join":{const r=addPlayer(G,fromId,a.name);if(!r.ok)this.transport.send(fromId,{t:"reject",reason:r.reason});break;}
      case "pick":draftPick(G,fromId,a.cardId);break;
      case "setLineup":setLineup(G,fromId,a.lineup,a.formation,a.tactic);break;
      case "ready":setReady(G,fromId,a.v);break;
      case "startDraft":if(fromId===this.hostId&&G.players.length>=G.minPlayers)startDraft(G);break;
      case "startMatch":{if(fromId!==this.hostId)break;const nx=nextTournamentMatch(G);if(nx)startMatch(G,nx.match.a,nx.match.b,G.tourney.type==="se");break;}
      case "matchTactic":{const side=G.match&&G.match.aId===fromId?"h":G.match&&G.match.bId===fromId?"a":null;if(side)matchTactic(G,side,a.tactic);break;}
      case "matchSub":{const side=G.match&&G.match.aId===fromId?"h":G.match&&G.match.bId===fromId?"a":null;if(side)matchSub(G,side,a.outPid,a.inPid);break;}
      case "matchSet":{const m=G.match;const k=m&&m.aId===fromId?"a":m&&m.bId===fromId?"b":null;if(k)matchSet(G,k,a.field,a.value);break;}
      case "confirmResult":{if(fromId!==this.hostId)break;const m=G.match;if(m&&m.resultReady){recordResult(G,m.resultReady.sh,m.resultReady.sa,m.resultReady.winnerId);}break;}
      case "advanceTourney":{if(fromId!==this.hostId)break;const champ=getChampion(G);if(champ){G.phase="champion";G.championId=champ;}break;}
    }
    this.broadcast();
  }
  broadcast(){
    if(!this.isHost)return;
    // to self
    this.state=publicState(this.G,this.selfId);this.onState(this.state);
    // to clients
    this.G.players.forEach(p=>{if(p.id!==this.selfId&&this.conns[p.id]){this.transport.send(p.id,{t:"state",state:publicState(this.G,p.id)});}});
  }
  /* CLIENT */
  becomeClient(hostId){
    this.isHost=false;this.hostId=hostId;
    this.onStatus({role:"client",host:hostId,id:this.selfId});
    this.send({t:"join",name:this.name});
  }
  send(a){ // client->host action (or host local)
    if(this.isHost){this.hostHandleAction(this.selfId,a);}
    else{this.transport.send(this.hostId,a);}
  }
  onPeerMessage(fromId,msg){
    if(this.isHost){
      if(!this.conns[fromId]&&msg.t!=="hello")this.conns[fromId]={};
      if(msg.t==="hello"){this.conns[fromId]={};return;}
      this.hostHandleAction(fromId,msg);
    }else{
      if(msg.t==="state"){this.state=msg.state;this.onState(this.state);}
      else if(msg.t==="reject"){this.onStatus({role:"rejected",reason:msg.reason});}
    }
  }
  hostOnClientConnect(id){this.conns[id]={};}
  hostOnClientDisconnect(id){const G=this.G;const p=G.players.find(x=>x.id===id);if(p)p.connected=false;delete this.conns[id];this.broadcast();}
}

/* ---- Real PeerJS transport with auto-matchmaking ---- */
async function connectAuto(name,onState,onStatus){
  // Try rooms 1..MAX. claim host or join existing.
  for(let room=1;room<=MAX_ROOMS;room++){
    const hostId=APP_ID+"-room"+room;
    const claim=await tryClaim(hostId);
    if(claim.claimed){
      // we are host of this room
      const node=new Node({name,onState,onStatus});
      node.selfId=hostId;node.roomNo=room;
      const peer=claim.peer;
      peer.on("connection",conn=>{
        conn.on("open",()=>{node.hostOnClientConnect(conn.peer);node._send=node._send;});
        conn.on("data",d=>node.onPeerMessage(conn.peer,d));
        conn.on("close",()=>node.hostOnClientDisconnect(conn.peer));
        node._conns=node._conns||{};node._conns[conn.peer]=conn;
      });
      node.transport={selfId:hostId,send:(to,msg)=>{const c=node._conns&&node._conns[to];if(c&&c.open)c.send(msg);}};
      node.becomeHost();
      onStatus({role:"host",room,id:hostId});
      return node;
    }else{
      // someone holds the id -> try to join
      const joined=await tryJoin(hostId,name);
      if(joined.ok){
        const node=new Node({name,onState,onStatus});
        node.selfId=joined.peer.id;node.roomNo=room;
        const conn=joined.conn;
        node.transport={selfId:joined.peer.id,send:(to,msg)=>{if(conn.open)conn.send(msg);}};
        conn.on("data",d=>node.onPeerMessage(hostId,d));
        conn.on("close",()=>onStatus({role:"host-left"}));
        node.becomeClient(hostId);
        onStatus({role:"client",room,host:hostId,id:node.selfId});
        return node;
      }
      // else full/started -> next room
    }
  }
  onStatus({role:"error",reason:"all rooms busy"});return null;
}
function tryClaim(id){return new Promise(res=>{
  const peer=new Peer(id,PEER_OPTS);let done=false;
  peer.on("open",()=>{if(!done){done=true;res({claimed:true,peer});}});
  peer.on("error",e=>{if(done)return;if(e.type==="unavailable-id"||/taken|unavailable/i.test(e.message||"")){done=true;try{peer.destroy();}catch(_){ }res({claimed:false});}else{done=true;res({claimed:false,err:e});}});
  setTimeout(()=>{if(!done){done=true;res({claimed:false,err:"timeout"});}},6000);
});}
function tryJoin(hostId,name){return new Promise(res=>{
  const peer=new Peer(PEER_OPTS);let done=false;
  peer.on("open",()=>{const conn=peer.connect(hostId,{reliable:true});
    conn.on("open",()=>{conn.send({t:"hello"});
      // wait briefly for a state or reject
      const to=setTimeout(()=>{if(!done){done=true;res({ok:true,peer,conn});}},1200);
      conn.on("data",d=>{if(done)return;if(d.t==="reject"){done=true;clearTimeout(to);try{peer.destroy();}catch(_){}res({ok:false,reason:d.reason});}else if(d.t==="state"){done=true;clearTimeout(to);res({ok:true,peer,conn});}});
    });
    conn.on("error",()=>{if(!done){done=true;res({ok:false});}});
  });
  peer.on("error",e=>{if(!done){done=true;res({ok:false,err:e});}});
  setTimeout(()=>{if(!done){done=true;try{peer.destroy();}catch(_){}res({ok:false,err:"timeout"});}},7000);
});}

/* ===================== REACT UI ===================== */
const PHASES=[["lobby","Lobby"],["draft","Draft"],["setup","Squad"],["tournament","Cup"],["champion","Champion"]];
function OvrBadge({ovr,pos,small}){const c=ovr>=88?"#16c784":ovr>=82?"#3da5ff":ovr>=75?"#f0a93b":"#8a98a8";
  return <div className="ovr" style={{background:c+"22",border:"1px solid "+c+"66",color:c,width:small?32:38,height:small?32:38}}><span className="v">{ovr}</span>{!small&&<span className="p" style={{color:POS_COLOR[pos]}}>{pos}</span>}</div>;}
function Traits({t}){return <span className="traits">{t.map(x=><span className="trait" key={x}>{x}</span>)}</span>;}

function Game({node,status}){
  const [state,setState]=useState(node.state);
  useEffect(()=>{node.onState=(s)=>setState({...s});if(node.state)setState({...node.state});},[node]);
  if(!state)return <div className="card pad center"><div className="muted">Connecting…</div></div>;
  const me=state.players.find(p=>p.id===state.you);
  const phaseIdx=PHASES.findIndex(p=>p[0]===state.phase);
  const act=(a)=>node.send(a);
  return (
    <div>
      <div className="app-head">
        <div className="logo">⚽ Gridiron <span className="accent">Cup</span></div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <span className="netpill"><span className="dot-ind" style={{background:status.role==="host"?"var(--gold)":"var(--grn)"}}></span>{status.role==="host"?"HOST":"online"} · room {status.room||"?"}</span>
          <span className="netpill">{state.players.length} player{state.players.length>1?"s":""}</span>
        </div>
      </div>
      <div className="progress">{PHASES.map((p,i)=><div key={p[0]} className={"step "+(i===phaseIdx?"active":i<phaseIdx?"done":"")}>{p[1]}</div>)}</div>
      {state.phase==="lobby"&&<Lobby state={state} me={me} isHost={node.isHost} act={act}/>}
      {state.phase==="draft"&&<Draft state={state} me={me} act={act}/>}
      {state.phase==="setup"&&<Setup state={state} me={me} act={act}/>}
      {state.phase==="tournament"&&<Tourney state={state} me={me} isHost={node.isHost} act={act}/>}
      {state.phase==="champion"&&<Champion state={state}/>}
    </div>
  );
}

function Lobby({state,me,isHost,act}){
  return (
    <div className="card pad" style={{maxWidth:560,margin:"0 auto"}}>
      <h2>Waiting room</h2>
      <p className="muted" style={{fontSize:13,marginTop:6}}>{isHost?"You're the host. Start when everyone's in (2–8 players).":"Waiting for the host to start the draft…"}</p>
      <div className="lobby-players">
        {state.players.map((p,i)=>(
          <div key={p.id} className={"lp"+(p.id===me.id?" me":"")}>
            <div className="av" style={{color:p.connected?"var(--grn)":"var(--dim)"}}>{p.name[0].toUpperCase()}</div>
            <div className="lpn">{p.name}{p.id===me.id?" (you)":""}</div>
            {i===0&&<span className="badge" style={{background:"rgba(255,203,69,.15)",color:"var(--gold)"}}>HOST</span>}
            {!p.connected&&<span className="badge" style={{background:"rgba(255,93,108,.15)",color:"var(--red)"}}>OFFLINE</span>}
          </div>
        ))}

function Setup({state,me,act}){
  const [sel,setSel]=useState(null);
  const m=me;const slots=slotsFor(m.formation);
  const lineupIds=Object.values(m.lineup);
  const bench=m.roster.filter(id=>!lineupIds.includes(id)).map(id=>PBI[id]).sort((a,b)=>b.ovr-a.ovr);
  const filled=slots.filter(s=>m.lineup[s.key]).length;
  const chem=useMemo(()=>computeChem(m.lineup,m.formation),[JSON.stringify(m.lineup),m.formation]);
  const str=squadStrength(m);
  const push=(patch)=>act({t:"setLineup",lineup:patch.lineup||m.lineup,formation:patch.formation||m.formation,tactic:patch.tactic||m.tactic});
  const changeForm=(f)=>{setSel(null);push({lineup:autoFill(m.roster,f),formation:f});};
  const clickSlot=(s)=>{
    if(sel&&sel!==s.key){const lu={...m.lineup};const a=lu[sel],b=lu[s.key];if(a)lu[s.key]=a;else delete lu[s.key];if(b)lu[sel]=b;else delete lu[sel];push({lineup:lu});setSel(null);}
    else setSel(sel===s.key?null:s.key);
  };
  const clickPlayer=(pid)=>{if(!sel)return;const lu={...m.lineup};for(const k of Object.keys(lu))if(lu[k]===pid)delete lu[k];lu[sel]=pid;push({lineup:lu});setSel(null);};
  const ready=filled===STARTERS;
  const others=state.players.filter(p=>p.id!==me.id);
  return (
    <div>
      <div className="row">
        <div className="col card pad" style={{minWidth:300}}>

            <div className="sectitle" style={{margin:0}}>Your Starting XI</div>
            <div style={{display:"flex",gap:6,alignItems:"center"}}>
              <span className="pill" style={{borderColor:"var(--grn)"}}>★ {str}</span>
              <span className="pill">{filled}/{STARTERS}</span>
              <button className="btn sm ghost" onClick={()=>{setSel(null);push({lineup:autoFill(m.roster,m.formation)});}}>Auto</button>
            </div>
          </div>
          <p className="muted" style={{fontSize:12,margin:"0 0 8px"}}>{sel?"Click a player (right) to place — or another slot to swap.":"Click a slot, then a bench player."}</p>
          <div className="pitch">
            <div className="mk" style={{left:"50%",top:0,bottom:0,width:0,borderWidth:"0 0 0 2px"}}/>
            <div className="mk" style={{left:"50%",top:"50%",width:74,height:74,borderRadius:"50%",transform:"translate(-50%,-50%)"}}/>
            {slots.map(s=>{const pid=m.lineup[s.key];const p=pid?PBI[pid]:null;const mm=p&&p.pos!==s.cat;
              return <div key={s.key} className={"slot"+(p?" filled":"")+(sel===s.key?" sel":"")+(mm?" mismatch":"")} style={{left:s.x+"%",top:s.y+"%"}} onClick={()=>clickSlot(s)}>
                <div className="disc" style={{borderColor:p?POS_COLOR[s.cat]:undefined}}>{p?p.name.split(" ").slice(-1)[0].slice(0,8):s.label}{p&&<span className="ovrtag">{p.ovr}</span>}</div>
                <div className="nm" style={{color:p?"#fff":POS_COLOR[s.cat]}}>{p?(p.flag+" "+p.pos+(mm?"⚠":"")):s.cat}</div>
              </div>;})}
          </div>
        </div>
        <div className="col" style={{maxWidth:320}}>
          <div className="card pad" style={{marginBottom:12}}>
            <div className="sectitle">Formation</div>
            <div className="formrow">{Object.keys(FORMATIONS).map(f=><button key={f} className={"formbtn"+(m.formation===f?" on":"")} onClick={()=>changeForm(f)}>{f}</button>)}</div>
            <div className="sectitle" style={{marginTop:4}}>Tactic</div>
            <div className="tactrow">{Object.entries(TACTICS).map(([k,t])=><button key={k} className={"tactbtn"+(m.tactic===k?" on":"")} onClick={()=>push({tactic:k})}><div className="tt">{t.icon} {t.label}</div><div className="td">{t.desc}</div></button>)}</div>
          </div>
          <div className="card pad" style={{marginBottom:12}}>
            <div className="sectitle">Team Chemistry</div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:12.5}}><span className="muted">Cohesion</span><b style={{color:chem.team>=7?"var(--grn)":chem.team>=4.5?"var(--gold)":"var(--red)"}}>{chem.team.toFixed(1)}/10</b></div>
            <div className="chembar"><div style={{width:(chem.team*10)+"%"}}/></div>
            {chem.syn.map(s=><div className="synergy" key={s.k}>✨ <b>{s.k}</b> — <span className="muted">{s.d}</span></div>)}
            {chem.syn.length===0&&<div className="muted" style={{fontSize:11.5,marginTop:6}}>Draft same-nation players & keep players in position for synergies.</div>}
          </div>
          <div className="card pad">
            <div className="sectitle">Bench ({bench.length})</div>
            <div className="bench-pool">
              {bench.map(p=><div key={p.id} className="pcard" style={{opacity:sel?1:.85}} onClick={()=>clickPlayer(p.id)}><OvrBadge ovr={p.ovr} pos={p.pos} small/><div className="pinfo"><div className="nm">{p.name}</div><div className="sub"><span>{p.flag}</span><b style={{color:POS_COLOR[p.pos]}}>{p.pos}</b></div></div></div>)}
              {bench.length===0&&<div className="muted" style={{fontSize:12}}>All players in XI.</div>}
            </div>
          </div>
        </div>
      </div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:14,gap:10,flexWrap:"wrap"}}>
        <div className="muted" style={{fontSize:12.5}}>{others.map(p=>p.name+(p.ready?" ✅":" ⏳")).join("  ·  ")||"no other players"}</div>
        <button className={"btn"+(me.ready?" ghost":"")} disabled={!ready} onClick={()=>act({t:"ready",v:!me.ready})}>{me.ready?"✅ Ready (tap to edit)":"Lock in squad →"}</button>
      </div>
    </div>
  );

function Tourney({state,me,isHost,act}){
  const t=state.tourney;const byId=Object.fromEntries(state.players.map(p=>[p.id,p]));
  if(state.match)return <MatchView state={state} me={me} isHost={isHost} act={act} byId={byId}/>;
  const nameOf=id=>byId[id]?byId[id].name:"TBD";
  // determine next match
  let next=null;
  if(t.type==="rr")next=t.schedule.find(m=>!m.played);
  else{outer:for(const rd of t.rounds)for(const m of rd){if(!m.played&&m.a&&m.b){next=m;break outer;}}}
  const champ=state.phase==="champion";
  return (
    <div>
      <h2>{t.type==="rr"?"League":"Knockout Cup"}</h2>
      {t.type==="rr"?<RR state={state} byId={byId} next={next} isHost={isHost} act={act}/>:
        <SE state={state} byId={byId} next={next} isHost={isHost} act={act} nameOf={nameOf}/>}
    </div>
  );
}
function RR({state,byId,next,isHost,act}){
  const t=state.tourney;const tbl=standings(state);
  const allDone=t.schedule.every(m=>m.played);
  return (
    <div className="row" style={{marginTop:12}}>
      <div className="col card pad" style={{minWidth:280}}>
        <div className="sectitle">Table</div>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr style={{color:"var(--muted)",fontSize:11}}><th style={{textAlign:"left",padding:6}}>Manager</th><th>P</th><th>W</th><th>D</th><th>L</th><th>Pts</th></tr></thead>
          <tbody>{tbl.map((r,i)=><tr key={r.id} style={{borderTop:"1px solid var(--line)",color:i===0&&r.P>0?"var(--grn)":undefined}}><td style={{textAlign:"left",padding:6,fontWeight:700}}>{i===0&&r.P>0?"👑 ":""}{byId[r.id].name}</td><td align="center">{r.P}</td><td align="center">{r.W}</td><td align="center">{r.D}</td><td align="center">{r.L}</td><td align="center"><b>{r.Pts}</b></td></tr>)}</tbody>
        </table>
      </div>
      <div className="col card pad" style={{minWidth:260}}>
        <div className="sectitle">Fixtures</div>
        <div style={{display:"flex",flexDirection:"column",gap:7}}>
          {t.schedule.map((m,i)=><div key={i} className={"match-card"+(m===next?" live":"")}>
            <div className={"mside"+(m.played&&m.sh>m.sa?" win":"")}><span className="mn">{byId[m.a].name}</span><span className="ms">{m.played?m.sh:""}</span></div>
            <div className={"mside"+(m.played&&m.sa>m.sh?" win":"")}><span className="mn">{byId[m.b].name}</span><span className="ms">{m.played?m.sa:""}</span></div>
            {m===next&&isHost&&<button className="playtag" style={{width:"100%",border:0}} onClick={()=>act({t:"startMatch"})}>▶ PLAY (host)</button>}
            {m===next&&!isHost&&<span className="playtag">waiting for host to start…</span>}
          </div>)}
        </div>
        {allDone&&isHost&&<button className="btn" style={{marginTop:12,width:"100%"}} onClick={()=>act({t:"advanceTourney"})}>Crown champion 👑</button>}
      </div>
    </div>
  );
}
function SE({state,byId,next,isHost,act,nameOf}){
  const t=state.tourney;const champ=getChampion(state);
  const rn=(tot,i)=>{const l=tot-i;return l===1?"Final":l===2?"Semis":l===3?"Quarters":"Round "+(i+1);};
  const tot=t.rounds.length+Math.ceil(Math.log2(Math.max(1,t.rounds[t.rounds.length-1].length)));
  return (
    <div>
      <div className="bracket" style={{marginTop:10}}>
        {t.rounds.map((rd,ri)=><div className="brd-round" key={ri}><h4>{rn(Math.log2(t.rounds[0].length*2),ri)}</h4>
          {rd.map((m,mi)=>{const isNext=m===next;
            if(m.bye)return <div className="match-card" key={mi}><div className="mside win"><span className="mn">{nameOf(m.winner)}</span></div><div className="bye">bye</div></div>;
            return <div key={mi} className={"match-card"+(isNext?" live":"")}>
              <div className={"mside"+(m.played&&m.winner===m.a?" win":"")}><span className="mn">{nameOf(m.a)}</span><span className="ms">{m.played?m.sh:""}</span></div>
              <div className={"mside"+(m.played&&m.winner===m.b?" win":"")}><span className="mn">{nameOf(m.b)}</span><span className="ms">{m.played?m.sa:""}</span></div>
              {isNext&&isHost&&<button className="playtag" style={{width:"100%",border:0}} onClick={()=>act({t:"startMatch"})}>▶ PLAY (host)</button>}
              {isNext&&!isHost&&<span className="playtag">waiting for host…</span>}
            </div>;})}
        </div>)}
      </div>
      {champ&&isHost&&<button className="btn" onClick={()=>act({t:"advanceTourney"})}>Crown champion 👑</button>}
    </div>
  );
}

/* ---- Live match view: text commentary + live manager settings ---- */

  const iAmA=me.id===m.aId,iAmB=me.id===m.bId;

  const benchB=B.roster.filter(id=>!Object.values(m.bLineup).includes(id)).map(id=>PBI[id]);
  const myBench=iAmA?benchA:iAmB?benchB:[];
  const myLineup=iAmA?m.aLineup:iAmB?m.bLineup:{};
  const myTactic=iAmA?m.aTactic:iAmB?m.bTactic:null;
  const mk=iAmA?"a":"b";                 // my settings key
  const myMent=iAmA?m.aMent:m.bMent, myInt=iAmA?m.aInt:m.bInt;

    <div style={{maxWidth:720,margin:"0 auto"}}>

        <div className="sb-mid"><div className="sb-score">{m.score.h} <span style={{color:"var(--dim)",fontSize:20}}>–</span> {m.score.a}</div><div className="sb-clock">{m.finished?"FULL TIME":m.minute+"'"}</div></div>
        <div className="sb-team r"><div className="tn" style={{color:"var(--blue)"}}>{B.name}{iAmB?" (you)":""}</div><div className="tt">{MENTALITY[m.bMent].label} · {TACTICS[m.bTactic].label} {TACTICS[m.bTactic].icon}</div></div>
      </div>

      <div className="statbars" style={{marginTop:12}}>
        <Bar label="Possession" h={possH} a={100-possH} suffix="%"/>
        <Bar label="Shots" h={m.stats.shH} a={m.stats.shA} ratio/>
        <Bar label="On target" h={m.stats.sotH} a={m.stats.sotA} ratio/>
        <Bar label="xG" h={m.stats.xgH.toFixed(1)} a={m.stats.xgA.toFixed(1)} ratioVals={[m.stats.xgH,m.stats.xgA]}/>

        </div>
        <div className="dash-row">
          <span className="dash-lbl">Intensity</span>
          <div className="seg3">{INTENSITY.map((x,i)=><button key={i} className={"segb"+(myInt===i?" on":"")} onClick={()=>act({t:"matchSet",field:"Int",value:i})}>{x.label}</button>)}</div>

      </div></div>}
    </div>
  );
}
function Bar({label,h,a,suffix,ratio,ratioVals}){let ph,pa;
  if(ratioVals){const t=(ratioVals[0]+ratioVals[1])||1;ph=ratioVals[0]/t*100;pa=ratioVals[1]/t*100;}
  else if(ratio){const t=(+h)+(+a)||1;ph=(+h)/t*100;pa=(+a)/t*100;}else{ph=h;pa=a;}
  return <div className="statbar"><div className="sl"><span>{h}{suffix||""}</span><span style={{color:"var(--muted)"}}>{label}</span><span>{a}{suffix||""}</span></div><div className="track"><div className="fillH" style={{width:ph+"%"}}/><div className="fillA" style={{width:pa+"%"}}/></div></div>;}

    <div className="card" style={{maxWidth:640,margin:"0 auto",overflow:"hidden"}}>

        <div className="muted">Champions of the Gridiron Cup</div>

          <span className="pill" style={{borderColor:"var(--gold)"}}>★ {seed?seed.str:""}</span>
          <span className="pill">{TACTICS[champ.tactic].icon} {TACTICS[champ.tactic].label}</span>
          <span className="pill">{champ.formation}</span><span className="pill">Chem {chem.team.toFixed(1)}</span>
        </div>
        <div className="statgrid">
          <div className="statbox"><div className="v">{star?star.name.split(" ").slice(-1)[0]:"—"}</div><div className="l">Star ({star?star.ovr:""})</div></div>
          <div className="statbox"><div className="v">{state.players.length}</div><div className="l">Managers</div></div>
          <div className="statbox"><div className="v">{seed?("#"+seed.seed):"—"}</div><div className="l">Seed</div></div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:6,textAlign:"left"}}>
          {xi.sort((a,b)=>POS_ORDER[a.pos]-POS_ORDER[b.pos]).map(p=><div key={p.id} className="rchip" style={{display:"flex",gap:6,borderColor:POS_COLOR[p.pos]+"55"}}><b style={{color:POS_COLOR[p.pos]}}>{p.ovr}</b> {p.name} {p.flag}</div>)}
        </div>
        <div style={{marginTop:20}}><button className="btn" onClick={()=>location.reload()}>🔄 New game</button></div>
      </div>
    </div>
  );
}

/* ===================== BOOTSTRAP ===================== */
function NameGate({onJoin}){
  const [name,setName]=useState("");
  return <div className="wrap"><div className="card pad" style={{maxWidth:440,margin:"40px auto"}}>
    <div className="logo" style={{justifyContent:"center",marginBottom:14}}>⚽ Gridiron <span className="accent">Cup</span></div>
    <h2 className="center">Join an online game</h2>
    <p className="muted center" style={{fontSize:13}}>You'll be auto-matched into a game with other players. First in becomes host.</p>
    <input className="txt" style={{marginTop:14}} placeholder="Your manager name" maxLength={18} value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&name.trim())onJoin(name.trim());}}/>
    <button className="btn" style={{width:"100%",marginTop:12}} disabled={!name.trim()} onClick={()=>onJoin(name.trim())}>Find a game →</button>
  </div></div>;
}
function OnlineApp(){
  const [node,setNode]=useState(null);const [status,setStatus]=useState({});const [err,setErr]=useState(null);const [connecting,setConnecting]=useState(false);
  const join=async(name)=>{
    setConnecting(true);
    try{
      const n=await connectAuto(name,()=>{},(st)=>{setStatus(st);if(st.role==="error")setErr(st.reason);});
      if(n)setNode(n);else setErr("Couldn't find or host a game (broker unreachable?).");
    }catch(e){setErr(String(e));}
    setConnecting(false);
  };
  if(err)return <div className="wrap"><div className="card pad" style={{maxWidth:440,margin:"40px auto"}}><h2>Connection problem</h2><p className="muted">{err}</p><p className="muted" style={{fontSize:12}}>The PeerJS public broker may be blocked on this network. Try another network, or switch to the self-hosted relay option.</p><button className="btn" onClick={()=>location.reload()}>Retry</button></div></div>;
  if(connecting)return <div className="wrap"><div className="card pad center" style={{maxWidth:440,margin:"40px auto"}}><div className="logo" style={{justifyContent:"center"}}>⚽ Gridiron <span className="accent">Cup</span></div><p className="muted" style={{marginTop:14}}>Finding a game… (claiming/joining a room)</p></div></div>;
  if(!node)return <NameGate onJoin={join}/>;
  return <div className="wrap"><Game node={node} status={status}/></div>;
}

/* ===================== DEV HARNESS (?dev=N) ===================== */
function DevApp({n}){
  const hub=useMemo(()=>new Hub(),[]);
  const nodes=useMemo(()=>{
    const arr=[];
    for(let i=0;i<n;i++){
      const id="dev"+i;
      const node=new Node({name:["Alice","Bob","Cara","Dan","Eve","Finn","Gus","Hana"][i]||("P"+i)});
      node.selfId=id;
      node.transport={selfId:id,send:(to,msg)=>hub.send(id,to,msg)};
      hub.reg(id,(from,msg)=>node.onPeerMessage(from,msg));
      arr.push(node);
    }
    // node 0 is host
    arr[0].roomNo=1;arr[0].becomeHost();
    arr.forEach((nd,i)=>{if(i>0){nd.roomNo=1;nd.hostId="dev0";arr[0].hostOnClientConnect(nd.selfId);nd.becomeClient("dev0");}});
    window.__devNodes=arr; // exposed for debugging/automation
    return arr;
  },[hub,n]);
  const cols=n<=2?2:n<=4?2:3;
  return (
    <div>
      <div className="devgrid" style={{gridTemplateColumns:`repeat(${cols},1fr)`}}>
        {nodes.map((nd,i)=>(
          <div className="devcell" key={i}>
            <div className="dchead"><span>👤 {nd.name} {i===0?"(HOST)":""}</span><span className="dim">{nd.selfId}</span></div>
            <div className="dcbody"><Game node={nd} status={{role:i===0?"host":"client",room:1}}/></div>
          </div>
        ))}
      </div>
      <div className="devbar">🧪 DEV HARNESS — {n} players over in-memory loopback (simulates real P2P protocol). Add ?dev=N to change count. Real online: remove the query param.</div>
    </div>
  );
}

const params=new URLSearchParams(location.search);
const dev=params.get("dev");
ReactDOM.createRoot(document.getElementById("root")).render(dev?<DevApp n={clamp(parseInt(dev)||4,2,8)}/>:<OnlineApp/>);
</script>
