<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Riftbound Solo Trainer</title>
<style>
  :root{
    --bg:#0f1217;--panel:#171b22;--panel2:#1d222b;--line:#2a313d;--line2:#3a4350;
    --txt:#e8edf4;--muted:#9aa6b6;--dim:#6b7686;
    --grn:#02a644;--orange:#ff7700;--red:#e0533d;--blue:#3d8be0;
    --radius:10px;--sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;line-height:1.5}
  .wrap{max-width:1100px;margin:0 auto;padding:22px 18px 80px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px;flex-wrap:wrap}
  .logo{font-size:24px;font-weight:800;letter-spacing:-.01em}
  .logo span{color:var(--orange);font-weight:600}
  .db-meta{font-size:12px;color:var(--dim)}
  .banner{padding:11px 14px;border-radius:var(--radius);background:var(--panel);
    border:1px solid var(--line);font-size:13.5px;margin-bottom:16px}
  .banner code{background:#000;padding:1px 6px;border-radius:5px;color:var(--orange);font-size:12.5px}
  .banner.warn{border-color:#5a4a1f;background:#241f12}
  .banner.bad{border-color:#5a2a1f;background:#241412;color:#ffb3a3}
  .decks{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:760px){.decks{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--grn);
    border-radius:var(--radius);padding:14px}
  .panel-h{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .dot{width:9px;height:9px;border-radius:50%}
  .deck-input{width:100%;height:230px;resize:vertical;background:#0c0f14;color:var(--txt);
    border:1px solid var(--line2);border-radius:8px;padding:11px;font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:12.5px;line-height:1.55}
  .deck-input:focus{outline:none;border-color:var(--grn)}
  .row{display:flex;gap:8px;margin-top:9px;align-items:center;flex-wrap:wrap}
  .btn{background:var(--grn);color:#fff;font-weight:700;padding:8px 16px;border:none;border-radius:7px;
    font-size:13px;cursor:pointer}
  .btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--txt)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .txt{flex:1;min-width:90px;background:#0c0f14;border:1px solid var(--line2);border-radius:7px;
    padding:8px 10px;color:var(--txt);font-size:13px}
  .txt:focus{outline:none;border-color:var(--grn)}
  .saved{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .chip{display:inline-flex;align-items:center;gap:2px;background:var(--panel2);border:1px solid var(--line);
    border-radius:6px;padding:1px 2px 1px 8px;font-size:12px}
  .chip .link{background:none;border:none;color:var(--blue);cursor:pointer;font-size:12px;padding:3px 2px}
  .chip .x{background:none;border:none;color:var(--dim);cursor:pointer;font-size:14px;padding:0 6px}
  .report{margin-top:11px;border-top:1px solid var(--line);padding-top:10px;font-size:13px}
  .report .ok{color:var(--grn);font-weight:700}
  .report .bad{color:#ffb3a3;font-weight:700}
  .counts{color:var(--muted);font-size:12px;margin:4px 0 7px}
  .err{color:#ffb3a3;font-size:12.5px}
  .warn{color:#e8c87a;font-size:12.5px}
  .status{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .status-h{font-weight:700;font-size:14px;margin-bottom:10px}
  .status ul{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:5px}
  .status li{font-size:13px}
  .status li.done{color:var(--grn)}
  .status li.todo{color:var(--dim)}
  .status code{background:#000;padding:1px 5px;border-radius:4px;color:var(--orange);font-size:12px}
  .kw-h{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-bottom:8px}
  .kw-grid{display:flex;flex-wrap:wrap;gap:6px}
  .kw{font-size:11.5px;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;
    padding:3px 8px;color:var(--muted);cursor:help}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="src/ui/app.js"></script>
</body>
</html>
